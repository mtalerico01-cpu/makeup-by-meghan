    <style>

        h1, h2, h3, h4, h5, h6 {

        h4 {

<body class="bg-white">
    <div id="root"></div>

    <script>
        // Simple SPA without routing library
        const app = {
            currentPage: 'home',
            bookingData: null,
            mobileNavOpen: false,

            // Navigation
            navigate(page) {
                this.currentPage = page;
                this.mobileNavOpen = false;
                this.render();
                window.scrollTo(0, 0);
            },

            toggleMobileNav() {
                this.mobileNavOpen = !this.mobileNavOpen;
                this.render();
            },

            getBaseRate(eventType) {
                switch (eventType) {
                    case 'wedding':
                        return 175;
                    case 'gala':
                    case 'prom':
                    case 'party':
                    case 'other':
                        return 125;
                    default:
                        return 175;
                }
            },

            getDiscountRate(numPeople) {
                const people = Math.max(1, Number(numPeople) || 1);
                if (people >= 9) return 0.20;
                if (people >= 5) return 0.15;
                if (people >= 3) return 0.10;
                return 0;
            },

            getTravelRatePerMile() {
                return 1.35;
            },

            getNonLocalBaseTravelFee() {
                return 35;
            },

            calculateEstimateBreakdown(eventType, numPeople, travelArea, travelMiles, addonsFee) {
                const people = Math.max(1, Number(numPeople) || 1);
                const serviceSubtotal = this.getBaseRate(eventType) * people;
                const discountRate = this.getDiscountRate(people);
                const discountAmount = Math.round(serviceSubtotal * discountRate);
                const miles = Math.max(0, Number(travelMiles) || 0);
                const travelBase = travelArea === 'nonlocal' ? this.getNonLocalBaseTravelFee() : 0;
                const travelMileage = travelArea === 'nonlocal'
                    ? Math.round(miles * this.getTravelRatePerMile())
                    : 0;
                const travel = travelBase + travelMileage;
                const addons = Math.max(0, Number(addonsFee) || 0);
                const estimatedTotal = serviceSubtotal - discountAmount + travel + addons;
                const depositDueNow = 250;
                const remainingBalance = Math.max(0, estimatedTotal - depositDueNow);

                return {
                    serviceSubtotal,
                    discountRate,
                    discountAmount,
                    travelArea,
                    travelMiles: miles,
                    travelBase,
                    travelMileage,
                    travel,
                    addons,
                    estimatedTotal,
                    depositDueNow,
                    remainingBalance
                };
            },

            formatCurrency(amount) {
                return `$${amount.toLocaleString('en-US')}`;
            },

            updateEstimate() {
                const form = document.getElementById('bookingForm');
                if (!form) return;

                const eventType = form.querySelector('[name="eventType"]')?.value || 'wedding';
                const numPeople = form.querySelector('[name="numGirls"]')?.value || 1;
                const travelArea = form.querySelector('[name="travelArea"]')?.value || 'local';
                const travelMiles = form.querySelector('[name="travelMiles"]')?.value || 0;
                const addonsFee = form.querySelector('[name="addonsEstimate"]')?.value || 0;
                const breakdown = this.calculateEstimateBreakdown(eventType, numPeople, travelArea, travelMiles, addonsFee);

                const numPeopleLabelEl = document.getElementById('numPeopleLabel');
                if (numPeopleLabelEl) {
                    numPeopleLabelEl.textContent = eventType === 'wedding'
                        ? 'Number of People (Bride + Bridesmaids) *'
                        : 'Number of People *';
                }

                const fields = {
                    estimateServiceSubtotal: breakdown.serviceSubtotal,
                    estimateTravelBaseFee: breakdown.travelBase,
                    estimateTravelMileageFee: breakdown.travelMileage,
                    estimateTravelFee: breakdown.travel,
                    estimateAddonsFee: breakdown.addons,
                    estimateTotal: breakdown.estimatedTotal,
                    estimateDepositDueNow: breakdown.depositDueNow,
                    estimateRemainingBalance: breakdown.remainingBalance
                };

                Object.entries(fields).forEach(([id, value]) => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.textContent = this.formatCurrency(value);
                    }
                });

                const summaryEl = document.getElementById('estimatePrice');
                if (summaryEl) {
                    summaryEl.textContent = this.formatCurrency(breakdown.estimatedTotal);
                }

                const discountLabelEl = document.getElementById('estimateDiscountLabel');
                if (discountLabelEl) {
                    discountLabelEl.textContent = breakdown.discountRate > 0
                        ? `Group Discount (${Math.round(breakdown.discountRate * 100)}%)`
                        : 'Group Discount';
                }

                const discountAmountEl = document.getElementById('estimateDiscountAmount');
                if (discountAmountEl) {
                    discountAmountEl.textContent = breakdown.discountAmount > 0
                        ? `-${this.formatCurrency(breakdown.discountAmount)}`
                        : this.formatCurrency(0);
                }

                const travelLabelEl = document.getElementById('estimateTravelLabel');
                if (travelLabelEl) {
                    if (breakdown.travelArea === 'nonlocal' && breakdown.travelMiles > 0) {
                        travelLabelEl.textContent = `Travel Fee ($${this.getTravelRatePerMile().toFixed(2)}/mile x ${breakdown.travelMiles} miles)`;
                    } else {
                        travelLabelEl.textContent = 'Travel Fee';
                    }
                }
            },

            // Header Component
            renderHeader() {
                return `
                    <header class="sticky top-0 z-50 bg-white border-b border-gray-100 shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="flex justify-between items-center h-20 sm:h-24 gap-4">
                                <a onclick="app.navigate('home')" class="flex-shrink-0 cursor-pointer group">
                                    <div class="brand-wrap">
                                        <div class="brand-lockup">
                                            <span class="brand-signature">
                                                <span class="brand-logo text-[1.85rem] sm:text-[2.45rem] md:text-[3rem] group-hover:opacity-85 transition-opacity">Makeup by Meghan</span>
                                            </span>
                                            <span class="brand-kicker">Bridal Makeup Artist</span>
                                        </div>
                                    </div>
                                </a>
                                <nav class="hidden md:flex items-center gap-3">
                                    <a onclick="app.navigate('home')" class="rounded-full px-4 py-2 text-sm font-medium cursor-pointer transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);${this.currentPage==='home'?'background:#d4a574;color:#fff;':'background:transparent;color:#b07c72;'}">Home</a>
                                    <a onclick="app.navigate('about')" class="rounded-full px-4 py-2 text-sm font-medium cursor-pointer transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);${this.currentPage==='about'?'background:#d4a574;color:#fff;':'background:transparent;color:#b07c72;'}">About</a>
                                    <a onclick="app.navigate('pricing')" class="rounded-full px-4 py-2 text-sm font-medium cursor-pointer transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);${this.currentPage==='pricing'?'background:#d4a574;color:#fff;':'background:transparent;color:#b07c72;'}">Pricing</a>
                                    <a href="#gallery" class="rounded-full px-4 py-2 text-sm font-medium transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);background:transparent;color:#b07c72;">Gallery</a>
                                    <a href="#testimonials" class="rounded-full px-4 py-2 text-sm font-medium transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);background:transparent;color:#b07c72;">Reviews</a>
                                    <button onclick="app.navigate('booking')" class="rounded-full px-6 py-2 text-sm font-medium hover:opacity-90 transition-opacity shadow-elegant" style="background:#d4a574;color:#fff;${this.currentPage==='booking'?'opacity:0.85;':''}">Book Now</button>
                                </nav>
                                <button onclick="app.toggleMobileNav()" class="md:hidden inline-flex items-center justify-center h-11 w-11 rounded-full transition-colors" style="border:1.5px solid rgba(212,165,116,0.5);color:#3a3a38;background:transparent;" aria-label="Toggle navigation" aria-expanded="${this.mobileNavOpen}">
                                    <span class="sr-only">Open menu</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" style="width:1.2rem;height:1.2rem;display:block;color:inherit;">
                                        <line x1="3" y1="5" x2="17" y2="5"/>
                                        <line x1="3" y1="10" x2="17" y2="10"/>
                                        <line x1="3" y1="15" x2="17" y2="15"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="md:hidden pb-4 ${this.mobileNavOpen ? 'block' : 'hidden'}">
                                <div class="rounded-2xl bg-cream p-4" style="border:1.5px solid rgba(212,165,116,0.5);">
                                    <div class="grid grid-cols-2 gap-3 text-sm font-medium">
                                        <a onclick="app.navigate('home')" class="rounded-full px-4 py-3 text-center cursor-pointer transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);${this.currentPage==='home'?'background:#d4a574;color:#fff;':'background:transparent;color:#b07c72;'}">Home</a>
                                        <a onclick="app.navigate('about')" class="rounded-full px-4 py-3 text-center cursor-pointer transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);${this.currentPage==='about'?'background:#d4a574;color:#fff;':'background:transparent;color:#b07c72;'}">About</a>
                                        <a onclick="app.navigate('pricing')" class="rounded-full px-4 py-3 text-center cursor-pointer transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);${this.currentPage==='pricing'?'background:#d4a574;color:#fff;':'background:transparent;color:#b07c72;'}">Pricing</a>
                                        <a href="#gallery" class="rounded-full px-4 py-3 text-center transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);background:transparent;color:#b07c72;">Gallery</a>
                                        <a href="#testimonials" class="rounded-full px-4 py-3 text-center transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);background:transparent;color:#b07c72;">Reviews</a>
                                        <button onclick="app.navigate('booking')" class="rounded-full px-4 py-3 text-center transition-colors" style="border:1.5px solid rgba(212,165,116,0.6);${this.currentPage==='booking'?'background:#d4a574;color:#fff;':'background:#d4a574;color:#fff;'}">Book Now</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>
                `;
            },

            // Footer Component
            renderFooter() {
                const year = new Date().getFullYear();
                return `
                    <footer class="bg-charcoal text-white py-12">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8 pb-8 border-b border-white/15">
                                <div>
                                    <h3 class="font-serif text-xl font-semibold text-rose-gold mb-2">Makeup by Meghan</h3>
                                    <p class="text-gray-200">Professional bridal makeup artistry for weddings and elevated events.</p>
                                </div>
                                <div>
                                    <h4 class="font-semibold text-rose-gold mb-3">Quick Links</h4>
                                    <ul class="space-y-2 text-gray-300">
                                        <li><a onclick="app.navigate('home')" class="hover:text-rose-gold transition-colors cursor-pointer">Home</a></li>
                                        <li><a onclick="app.navigate('about')" class="hover:text-rose-gold transition-colors cursor-pointer">About</a></li>
                                        <li><a onclick="app.navigate('pricing')" class="hover:text-rose-gold transition-colors cursor-pointer">Pricing</a></li>
                                        <li><a onclick="app.navigate('booking')" class="hover:text-rose-gold transition-colors cursor-pointer">Book Now</a></li>
                                        <li><a href="#gallery" class="hover:text-rose-gold transition-colors">Gallery</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 class="font-semibold text-rose-gold mb-3">Contact</h4>
                                    <p class="text-gray-300 mb-2">
                                        <a href="mailto:meghantalerico@gmail.com" class="hover:text-rose-gold transition-colors">meghantalerico@gmail.com</a>
                                    </p>
                                    <p class="text-gray-300 mb-2">
                                        <a href="tel:+17708655862" class="hover:text-rose-gold transition-colors">770 865 5862</a>
                                    </p>
                                    <p class="text-gray-300">Serving brides, bridal parties, and special events across Johns Creek and Metro Atlanta.</p>
                                </div>
                            </div>
                            <div class="text-center text-gray-400 text-sm">
                                <p>&copy; ${year} Makeup by Meghan. All rights reserved.</p>
                            </div>
                        </div>
                    </footer>
                `;
            },

            // Home Page
            renderHome() {
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const today = new Date();
                const currentMonth = today.getMonth();
                const currentYear = today.getFullYear();
                
                // Generate calendar days
                const firstDay = new Date(currentYear, currentMonth, 1);
                const lastDay = new Date(currentYear, currentMonth + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = firstDay.getDay();
                
                let calendarDays = '';
                // Empty cells for days before month starts
                for (let i = 0; i < startingDayOfWeek; i++) {
                    calendarDays += '<div class="text-gray-300 text-center py-2"></div>';
                }
                // Days of month
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(currentYear, currentMonth, day);
                    const dateString = date.toISOString().split('T')[0];
                    const isToday = day === today.getDate();
                    const isPast = date < new Date(today.getFullYear(), today.getMonth(), today.getDate());
                    
                    if (isPast) {
                        calendarDays += `<div class="text-gray-300 text-center py-2 text-sm">${day}</div>`;
                    } else {
                        calendarDays += `
                            <button onclick="app.selectBookingDate('${dateString}')" class="group relative text-center py-2 text-sm font-semibold rounded-lg transition-all duration-200 ${isToday ? 'bg-amber-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-gray-200 hover:border-amber-600 hover:bg-amber-50 hover:shadow-md'}">
                                ${day}
                            </button>
                        `;
                    }
                }
                
                return `
                    ${this.renderHeader()}
                    <main>
                        <!-- Hero Section with Calendar -->
                        <section class="relative overflow-hidden bg-cream py-14 sm:py-16 md:py-32">
                            <div class="section-photo-layer" style="background-image:url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1600&h=1000&fit=crop')"></div>
                            <div class="section-photo-overlay"></div>
                            <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-12 items-start">
                                    <!-- Left Content -->
                                    <div class="flex flex-col gap-6 sm:gap-8">
                                        <div>
                                            <p class="text-rose-gold text-[11px] sm:text-xs font-semibold tracking-widest uppercase mb-4">Professional Bridal Makeup</p>
                                            <h1 class="font-serif text-4xl sm:text-5xl md:text-6xl text-charcoal font-semibold leading-tight mb-5 sm:mb-6">Flawless Beauty,<br />Unforgettable Moment</h1>
                                        </div>
                                            <p class="text-warm-gray text-base sm:text-lg leading-relaxed max-w-lg">Every wedding look is customized for your features, photography timeline, and bridal style. Meghan delivers polished, long-wear artistry so you feel confident from first look to final dance.</p>
                                        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 pt-2">
                                            <button onclick="app.navigate('booking')" class="inline-block bg-rose-gold text-white px-8 py-4 rounded-full font-medium hover:opacity-90 transition-opacity shadow-elegant min-h-12">Book Your Appointment</button>
                                            <a href="tel:+17708655862" class="inline-flex items-center justify-center gap-2 border-2 border-rose-gold text-rose-gold px-8 py-4 rounded-full font-medium transition-all min-h-12 no-underline" style="color:var(--rose-gold,#b07c72);">
                                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:1.1em;height:1.1em;flex-shrink:0;"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
                                                <span style="color:inherit;">Call Now</span>
                                            </a>
                                        </div>
                                    </div>

                                    <!-- Right Calendar Widget -->
                                    <div class="relative h-full mobile-calendar-wrap">
                                        <div class="sticky top-20 sm:top-24 bg-white rounded-2xl shadow-elegant-lg p-4 sm:p-6 lg:p-8 border border-elegant">
                                            <h3 class="font-serif text-xl sm:text-2xl font-semibold text-charcoal mb-2">Select Your Date</h3>
                                            <p class="text-warm-gray text-xs sm:text-sm mb-4 sm:mb-6">Pick a date and start booking</p>
                                            
                                            <!-- Month/Year Header -->
                                            <div class="flex justify-between items-center mb-4 sm:mb-6 pb-3 sm:pb-4 border-b border-elegant">
                                                <h4 class="font-semibold text-sm sm:text-base text-charcoal">${monthNames[currentMonth]} ${currentYear}</h4>
                                                <div class="flex gap-2">
                                                    <span class="text-[10px] sm:text-xs text-taupe">← Current Month →</span>
                                                </div>
                                            </div>
                                            
                                            <!-- Day Headers -->
                                            <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-3">
                                                <div class="text-center text-[10px] sm:text-xs font-semibold text-rose-gold py-2">Sun</div>
                                                <div class="text-center text-[10px] sm:text-xs font-semibold text-rose-gold py-2">Mon</div>
                                                <div class="text-center text-[10px] sm:text-xs font-semibold text-rose-gold py-2">Tue</div>
                                                <div class="text-center text-[10px] sm:text-xs font-semibold text-rose-gold py-2">Wed</div>
                                                <div class="text-center text-[10px] sm:text-xs font-semibold text-rose-gold py-2">Thu</div>
                                                <div class="text-center text-[10px] sm:text-xs font-semibold text-rose-gold py-2">Fri</div>
                                                <div class="text-center text-[10px] sm:text-xs font-semibold text-rose-gold py-2">Sat</div>
                                            </div>
                                            
                                            <!-- Calendar Grid -->
                                            <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-4 sm:mb-6">
                                                ${calendarDays}

                                            <button type="submit" class="px-8 py-3 bg-amber-600 text-white rounded-lg font-semibold hover:bg-amber-700 transition-colors shadow-lg">Submit Booking</button>
                                        </div>

                                        <p class="text-center text-gray-600 text-sm mt-6">We'll review your request and contact you within 24 hours to confirm availability.</p>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </main>
                    ${this.renderFooter()}
                `;
            },

            handleSubmit(event) {
                event.preventDefault();
                const form = event.target;
                const formData = new FormData(form);
                
                const data = {
                    fullName: formData.get('fullName'),
                    email: formData.get('email'),
                    phone: formData.get('phone'),
                    eventDate: formData.get('eventDate'),
                    eventType: formData.get('eventType'),
                    numGirls: formData.get('numGirls'),
                    travelArea: formData.get('travelArea'),
                    travelMiles: formData.get('travelMiles'),
                    addonsEstimate: formData.get('addonsEstimate'),
                    makeupPreference: formData.get('makeupPreference'),
                    eventDetails: formData.get('eventDetails')
                };

                const estimate = this.calculateEstimateBreakdown(
                    data.eventType,
                    data.numGirls,
                    data.travelArea,
                    data.travelMiles,
                    data.addonsEstimate
                );
                data.travelFeeEstimate = estimate.travel;

                // Show success message
                alert(`Thank you, ${data.fullName}!\n\nYour booking request has been submitted.\n\nWe'll contact you at ${data.email} or ${data.phone} within 24 hours to confirm.\n\nEvent Date: ${data.eventDate}`);
                
                // Log the data (in production, this would send to a server)
                console.log('Booking Data:', data);

                // Reset form and navigate home
                form.reset();
                this.navigate('home');
                return false;
            },

            selectBookingDate(dateString) {
                this.bookingData = { date: dateString };
                this.navigate('booking');
            },

            render() {
                const root = document.getElementById('root');
                
                switch(this.currentPage) {
                    case 'about':
                        root.innerHTML = this.renderAbout();
                        break;
                    case 'pricing':
                        root.innerHTML = this.renderPricing();
                        break;
                    case 'booking':
                        root.innerHTML = this.renderBooking();
                        this.updateEstimate();
                        break;
                    default:
                        root.innerHTML = this.renderHome();
                }
            }
        };

        // Initialize the app
        app.render();
    </script>
</body>
</html>
